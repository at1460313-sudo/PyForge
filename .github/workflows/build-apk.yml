name: Build APK

# Builds PyForge in the cloud. Push this repo to GitHub, open the Actions
# tab, and download the artifact "pyforge-release-apk" when the build is
# green (~15-25 min first run). No local Flutter/Android SDK needed.
#
# The APK is signed with the debug keystore (fine for sideloading your own
# builds). For Play Store releases, add the keystore + key.properties as
# repository secrets and wire them into android/app/build.gradle.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned so a new stable release cannot break the build overnight.
          # Bump deliberately, then re-run this workflow before merging.
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Generate Gradle wrapper and platform files
        run: |
          flutter create . --platforms=android --project-name pyforge
          test -f android/gradlew && echo "gradle wrapper OK"

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (catches compile errors before the slow build)
        run: flutter analyze --no-fatal-infos

      - name: Flutter unit tests
        run: flutter test

      - name: Run bridge host tests
        run: python3 tools/host_test_bridge.py

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyforge-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

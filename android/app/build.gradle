plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // Chaquopy: embeds a full CPython interpreter and our pyforge.* helpers.
    id "com.chaquo.python"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.pyforge.ide"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId = "com.pyforge.ide"
        minSdk = 24
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Falls back to the debug keystore so first builds "just work".
            // For Play Store releases, create android/key.properties (see README).
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

chaquopy {
    defaultConfig {
        // Python sources live in android/app/src/main/python (default sourceSet).
        // Python version defaults to 3.10; pin e.g. version = "3.10" if desired.

        pip {
            // Packages bundled into the APK — always available offline.
            // Add anything else you need here, then rebuild (see README, "Packages").
            install("numpy")
            install("requests")
            // Pure-Python Git implementation used by the version-control feature.
            // If this line ever breaks a build on your machine, remove it —
            // everything else keeps working (push becomes unavailable).
            install("dulwich==0.22.1")
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
